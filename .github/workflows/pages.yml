name: Build and deploy site

on:
  push:
    branches: [master]
  schedule:
    # Re-fetch Goodreads data and redeploy daily even with no content changes.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch Goodreads data
        # Goodreads is an external dependency outside our control (outage,
        # rate limit/WAF block, markup change). Don't let a failure here
        # block deploying unrelated content changes — but let the step
        # itself show red in the Actions tab so a real failure is visible
        # instead of being silently swallowed.
        continue-on-error: true
        run: ruby script/fetch_goodreads.rb

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
